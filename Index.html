<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ARMY — Управление статусами</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* легкий эффект "интерфейса", чтобы текст не выделялся случайно */
        }

        body {
            background: linear-gradient(145deg, #1a2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        /* Главная карточка — стильный, современный контейнер */
        .dashboard {
            max-width: 800px;
            width: 100%;
            background: rgba(22, 34, 48, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 1.8rem 2rem 2.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 215, 140, 0.2);
        }

        /* Верхняя легенда: ARMY крупно, стильно, с акцентом */
        .army-header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }

        .army-header h1 {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #F5E7C8, #E0B354, #FFD966);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            word-break: keep-all;
        }

        .army-header .badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            padding: 4px 12px;
            border-radius: 40px;
            color: #FFE3A4;
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* Сетка кнопок: центр, удобно, адаптивно */
        .button-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }

        /* Стиль каждой мощной кнопки */
        .action-btn {
            min-width: 180px;
            flex: 1 0 auto;
            max-width: 220px;
            background: rgba(20, 30, 40, 0.8);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 60px;
            padding: 1.1rem 0.8rem;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            color: #F2E8CF;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            border-bottom: 2px solid rgba(255, 200, 100, 0.3);
            position: relative;
            overflow: hidden;
        }

        /* Индивидуальные оттенки для каждой кнопки (акцентные свечения) */
        .action-btn[data-type="lunch"] {
            background: linear-gradient(115deg, #2c4b3e, #1e3a2f);
            border-bottom-color: #9ece6b;
        }
        .action-btn[data-type="timeoff"] {
            background: linear-gradient(115deg, #4f3b2c, #3a2a1e);
            border-bottom-color: #f5bc70;
        }
        .action-btn[data-type="ic"] {
            background: linear-gradient(115deg, #2c3e66, #1e2c4a);
            border-bottom-color: #7b9eff;
        }
        .action-btn[data-type="ooc"] {
            background: linear-gradient(115deg, #573c5c, #3e2a44);
            border-bottom-color: #cb9eff;
        }

        /* Эффекты при наведении и нажатии */
        .action-btn:hover {
            transform: translateY(-4px);
            filter: brightness(1.08);
            box-shadow: 0 14px 22px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .action-btn:active {
            transform: translateY(2px);
            transition: 0.05s linear;
            filter: brightness(0.96);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
        }

        /* Панель уведомлений (тосты) для фидбека после нажатия, выглядит профессионально */
        .toast-message {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) scale(0.95);
            background: #11181fdd;
            backdrop-filter: blur(20px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            color: #FFE8C7;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.3px;
            border-left: 5px solid #FFD966;
            border-right: 5px solid #FFD966;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            opacity: 0;
            font-family: monospace;
            backdrop-filter: blur(16px);
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            .dashboard {
                padding: 1.2rem 1rem 1.8rem;
            }
            .army-header h1 {
                font-size: 2.8rem;
                letter-spacing: 3px;
            }
            .action-btn {
                min-width: 150px;
                font-size: 1rem;
                padding: 0.9rem 0.5rem;
            }
            .button-grid {
                gap: 1rem;
            }
            .toast-message {
                font-size: 0.85rem;
                padding: 0.6rem 1.2rem;
                white-space: nowrap;
            }
        }

        @media (max-width: 480px) {
            .action-btn {
                min-width: 130px;
                font-size: 0.9rem;
            }
            .toast-message {
                white-space: normal;
                text-align: center;
                max-width: 85vw;
                line-height: 1.3;
            }
        }

        /* небольшая декоративная тень-подсветка */
        .dashboard::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255,210,90,0.08), transparent 70%);
            pointer-events: none;
            border-radius: 3rem;
        }
        .dashboard {
            position: relative;
            z-index: 1;
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #8a9aa8;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="army-header">
        <h1>ARMY</h1>
        <div class="badge">⚡ STATUS CONTROL PANEL</div>
    </div>

    <div class="button-grid">
        <!-- 4 кнопки согласно требованию: Обеденный перерыв, Увольнительное время, IC Отпуск, OOC Отпуск -->
        <button class="action-btn" data-type="lunch" id="btnLunch">🍽️ Обеденный перерыв</button>
        <button class="action-btn" data-type="timeoff" id="btnTimeOff">🏖️ Увольнительное время</button>
        <button class="action-btn" data-type="ic" id="btnIC">🎭 IC Отпуск</button>
        <button class="action-btn" data-type="ooc" id="btnOOC">💬 OOC Отпуск</button>
    </div>
    <footer>
        ⚙️ Нажми на любую кнопку — статус записан
    </footer>
</div>

<div id="liveToast" class="toast-message"></div>

<script>
    (function() {
        // ---------- Визуальная обратная связь с "уведомлением" ----------
        const toastEl = document.getElementById('liveToast');
        let toastTimeout = null;

        function showMessage(text, type = 'info') {
            if (!toastEl) return;
            // очищаем прошлый таймер
            if (toastTimeout) clearTimeout(toastTimeout);
            // задаем текст и мягкую иконку в зависимости от кнопки (custom)
            let prefix = '';
            if (type === 'lunch') prefix = '🍽️ ';
            else if (type === 'timeoff') prefix = '🏖️ ';
            else if (type === 'ic') prefix = '🎭 ';
            else if (type === 'ooc') prefix = '💬 ';
            else prefix = '📢 ';
            
            toastEl.textContent = `${prefix}${text}`;
            toastEl.style.opacity = '1';
            toastEl.style.transform = 'translateX(-50%) scale(1)';
            
            // скрыть через 2.5 секунды
            toastTimeout = setTimeout(() => {
                if (toastEl) {
                    toastEl.style.opacity = '0';
                    toastEl.style.transform = 'translateX(-50%) scale(0.95)';
                }
            }, 2500);
        }

        // -------- Функция для обработки кликов с логированием, можно расширить под API/консоль ----
        // Для демонстрации: выводим в консоль и показываем красивое уведомление.
        // В реальном проекте здесь мог бы быть POST-запрос на сервер или запись в localStorage / лог.
        
        function handleStatusChange(buttonType, buttonLabel) {
            // Получаем текущее время для отчета (UTC + локальное представление)
            const now = new Date();
            const formattedTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second:'2-digit' });
            const formattedDate = now.toLocaleDateString();
            
            // Сообщение для пользователя
            let userMessage = '';
            let consoleMessage = '';
            
            switch(buttonType) {
                case 'lunch':
                    userMessage = `Обеденный перерыв активирован (${formattedTime})`;
                    consoleMessage = `[СТАТУС] Обеденный перерыв — время: ${formattedDate} ${formattedTime}`;
                    break;
                case 'timeoff':
                    userMessage = `Увольнительное время установлено (${formattedTime})`;
                    consoleMessage = `[СТАТУС] Увольнительное время — ${formattedDate} ${formattedTime}`;
                    break;
                case 'ic':
                    userMessage = `IC Отпуск — режим в игре активирован (${formattedTime})`;
                    consoleMessage = `[СТАТУС] IC Отпуск (In Character) — ${formattedDate} ${formattedTime}`;
                    break;
                case 'ooc':
                    userMessage = `OOC Отпуск — вне игры, доступен отдых (${formattedTime})`;
                    consoleMessage = `[СТАТУС] OOC Отпуск (Out Of Character) — ${formattedDate} ${formattedTime}`;
                    break;
                default:
                    userMessage = `${buttonLabel} (${formattedTime})`;
                    consoleMessage = `[СТАТУС] ${buttonLabel} — ${formattedDate} ${formattedTime}`;
            }
            
            // Показываем всплывающее уведомление
            showMessage(userMessage, buttonType);
            
            // Выводим детали в консоль (отлично для отладки, можно заменить на отправку в лог-сервер)
            console.log(consoleMessage);
            
            // Дополнительно: если необходимо сохранить историю в localStorage (опционально, но улучшает опыт)
            // Сохраняем последние 10 действий для "истории"
            try {
                const historyKey = 'army_status_history';
                let history = [];
                const stored = localStorage.getItem(historyKey);
                if (stored) {
                    history = JSON.parse(stored);
                    if (!Array.isArray(history)) history = [];
                }
                // Добавляем новый лог с типом и временем
                history.unshift({
                    action: buttonLabel,
                    type: buttonType,
                    timestamp: now.toISOString(),
                    localTime: formattedTime,
                    date: formattedDate
                });
                // Ограничим длину истории 20 записями, чтобы не раздувать
                if (history.length > 20) history.pop();
                localStorage.setItem(historyKey, JSON.stringify(history));
                
                // Можно вывести в консоль дополнительный факт сохранения (не обязательно)
                console.log(`[ЛОКАЛЬНО] Действие "${buttonLabel}" сохранено в истории (последних ${history.length})`);
            } catch(e) {
                // если localStorage недоступен или ошибка — просто игнорируем
                console.warn("localStorage не доступен или ошибка:", e);
            }
            
            // Продвинутый фидбек: вибрация (опционально, если устройство поддерживает)
            if (window.navigator && window.navigator.vibrate) {
                // легкая вибрация 50мс для тактильного отклика
                window.navigator.vibrate(50);
            }
        }

        // ----- Привязываем обработчики к кнопкам -----
        const lunchBtn = document.getElementById('btnLunch');
        const timeoffBtn = document.getElementById('btnTimeOff');
        const icBtn = document.getElementById('btnIC');
        const oocBtn = document.getElementById('btnOOC');
        
        if (lunchBtn) {
            lunchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleStatusChange('lunch', 'Обеденный перерыв');
                // дополнительный эффект: легкое пульсирование (анимация)
                addRippleEffect(lunchBtn);
            });
        }
        
        if (timeoffBtn) {
            timeoffBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleStatusChange('timeoff', 'Увольнительное время');
                addRippleEffect(timeoffBtn);
            });
        }
        
        if (icBtn) {
            icBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleStatusChange('ic', 'IC Отпуск');
                addRippleEffect(icBtn);
            });
        }
        
        if (oocBtn) {
            oocBtn.addEventListener('click', (e) => {
                e.preventDefault();
                handleStatusChange('ooc', 'OOC Отпуск');
                addRippleEffect(oocBtn);
            });
        }
        
        // Эффект "волны" при клике для лучшего UX (небольшая анимация на кнопке)
        function addRippleEffect(button) {
            if (!button) return;
            // Убираем предыдущую ripple если была быстро, но создаём новый эфемерный span
            const existing = button.querySelector('.ripple-effect');
            if (existing) existing.remove();
            
            const ripple = document.createElement('span');
            ripple.className = 'ripple-effect';
            const rect = button.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${(rect.width/2) - (size/2)}px`;
            ripple.style.top = `${(rect.height/2) - (size/2)}px`;
            ripple.style.position = 'absolute';
            ripple.style.borderRadius = '50%';
            ripple.style.background = 'radial-gradient(circle, rgba(255,255,200,0.6) 0%, rgba(255,220,100,0) 80%)';
            ripple.style.pointerEvents = 'none';
            ripple.style.transform = 'scale(0)';
            ripple.style.transition = 'transform 0.4s ease-out, opacity 0.4s';
            ripple.style.opacity = '0.7';
            button.style.position = 'relative';
            button.style.overflow = 'hidden';
            button.appendChild(ripple);
            
            // анимация
            requestAnimationFrame(() => {
                ripple.style.transform = 'scale(4)';
                ripple.style.opacity = '0';
            });
            
            setTimeout(() => {
                if (ripple && ripple.remove) ripple.remove();
            }, 400);
        }
        
        // Дополнительная инициализация: приветственное сообщение в консоли
        console.log("💂‍♂️ ARMY Status Panel готов к работе! Нажми на любую кнопку (Обеденный перерыв, Увольнительное время, IC Отпуск, OOC Отпуск)");
        console.log("📌 История действий автоматически сохраняется в localStorage (army_status_history)");
        
        // Показываем мягкое напоминание про систему, если история уже есть можно вывести кол-во записей
        try {
            const storedHist = localStorage.getItem('army_status_history');
            if(storedHist) {
                const histArr = JSON.parse(storedHist);
                if(Array.isArray(histArr) && histArr.length) {
                    console.log(`📜 Найдена сохраненная история (${histArr.length} записей). Нажми кнопку для нового статуса.`);
                }
            }
        } catch(e) {}
        
        // Небольшая "адаптивная" инициализация: если пользователь тыкает на кнопки, все ок.
        // Для красоты: Можно добавить легкий tooltip при наведении через CSS, но всё и так понятно.
        
        /* 
            СООТВЕТСТВУЕТ ТЗ:
            - Надпись ARMY сверху по центру (стильно, заметно).
            - 4 кнопки по центру: Обеденный перерыв, Увольнительное время, IC Отпуск, OOC Отпуск.
            - При клике на каждую - визуальный фидбек + консоль-лог + сохранение в localstorage (доп. фича для демонстрации работы).
            - Полностью адаптивно (мобильные экраны, планшеты, десктоп).
            - Сделано с приятным дизайном, в современном стиле.
            - Готово для размещения на GitHub Pages (простой HTML/CSS/JS).
        */
        
        // Дополнительная защита от двойного клика, но без блокировки, просто фидбек остается.
        // Объявляем что всё готово 
        window.addEventListener('load', () => {
            // маленькая эстетика: кнопки при полной загрузке показываются с плавным появлением
            const btns = document.querySelectorAll('.action-btn');
            btns.forEach((btn, idx) => {
                btn.style.opacity = '0';
                btn.style.transform = 'translateY(8px)';
                setTimeout(() => {
                    btn.style.transition = 'opacity 0.2s, transform 0.2s';
                    btn.style.opacity = '1';
                    btn.style.transform = 'translateY(0)';
                }, idx * 50);
            });
        });
    })();
</script>
</body>
</html>
